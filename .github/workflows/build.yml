name: Release

# Required to create the GitHub release / publish to the BOSS Plugin Store. Without
# contents: write the Release workflow 403s when the shared plugin-release.yml tries
# to create a release on push to main.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    uses: risa-labs-inc/BossConsole-Releases/.github/workflows/plugin-release.yml@main
    with:
      boss_plugin_api_version: 'latest'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}
